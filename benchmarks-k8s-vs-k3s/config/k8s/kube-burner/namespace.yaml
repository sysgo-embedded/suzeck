apiVersion: v1
kind: Namespace
metadata:
  name: kube-burner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-burner
  namespace: kube-burner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-burner
rules:
# Namespace management (already needed)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["create", "delete", "get", "list"]

# DaemonSet creation for image preloading, and deployments for workloads batch processing
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments"]
  verbs: ["create", "delete", "get", "list", "watch"]

# Pods created by the DaemonSet
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "delete", "get", "list", "watch"]

- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["create", "delete", "get", "list", "watch"]

# Optional but recommended (events & cleanup)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-burner
subjects:
- kind: ServiceAccount
  name: kube-burner
  namespace: kube-burner
roleRef:
  kind: ClusterRole
  name: kube-burner
  apiGroup: rbac.authorization.k8s.io
